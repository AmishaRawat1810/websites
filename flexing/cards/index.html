<!doctype html>
<html lang="en">

<head>
  <title>Gradients Pack</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    main {
      height: 100vh;
      width: 100vw;
      display: flex;
    }

    .nav {
      width: 16vw;
      height: 95vh;
      background-color: white;
      overflow-y: auto;
      margin: 20px 20px 20px 0px;
      justify-content: center;
    }

    .pattern-area {
      display: none;
    }

    .pattern-area:target {
      background-color: white;
      flex-grow: 1;
      display: block;
      margin: 20px 20px 20px 0px;
    }

    #ladyBug {
      background-image: var(--lady-bug);
      background-size: 40px 40px;
    }

    #checker {
      background-image: var(--checker);
      background-size: 50px 50px;
    }

    #memories {
      background-image: var(--memories);
    }

    #greenfields {
      background-image: var(--greenfields);
      background-size: 50px 50px;
    }

    #alien-eye {
      background-image: var(--alien-eye);
      background-size: 50px 50px;
    }

    #saturn {
      background-image: var(--saturn);
    }

    #submerged-sea-pearl {
      background-image: var(--submerged-sea-pearl);
    }

    #deep-sea {
      background-image: var(--deep-sea);
    }

    #bloody-red {
      background-image: var(--bloody-red);
      background-size: 50px 50px;
    }

    #aurora {
      background-image: var(--aurora);
    }

    #pencils {
      background-image: var(--pencils);
      background-size: 312px;
    }

    #instagram {
      background-image: var(--instagram);
    }

    #linear-lines {
      background-image: var(--linear-lines);
    }

    a {
      text-decoration: none;
      font-size: 1.6em;
      color: black;
    }

    ul>li {
      list-style: none;
      padding: 16px;
    }

    #face.pattern-area:target {
      top: 30vh;
      left: 50vw;
      width: 50px;
      height: 50px;
      background: darkslategray;
      box-shadow: 100px 0px darkslategray,
        150px 100px darkslategray,
        -50px 100px darkslategray,
        0px 150px darkslategray,
        50px 150px darkslategray,
        100px 150px darkslategray;
    }
  </style>
</head>

<body>
  <main>
    <div class="nav">
      <ul>
        <li><a href="#ladyBug">Lady Bug</a></li>
        <li><a href="#checker">Checker</a></li>
        <li><a href="#deep-sea">Deep Sea</a></li>
        <li><a href="#memories">Memories</a></li>
        <li><a href="#greenfields">Greenfields</a></li>
        <li><a href="#alien-eye">Alien Eyes</a></li>
        <li><a href="#saturn">Saturn</a></li>
        <li><a href="#submerged-sea-pearl">Submerged Sea Pearl</a></li>
        <li><a href="#bloody-red">Bloody Red</a></li>
        <li><a href="#aurora">Aurora</a></li>
        <li><a href="#instagram">Instagram</a></li>
        <li><a href="#pencils">Pencils</a></li>
        <li><a href="#linear-lines">Linear Lines</a></li>
        <li><a href="#face">Face</a></li>
        <li><a href="#animated-text">Animated Text</a></li>
      </ul>
    </div>
    <div id="ladyBug" class="pattern-area"></div>
    <div id="checker" class="pattern-area"></div>
    <div id="memories" class="pattern-area"></div>
    <div id="greenfields" class="pattern-area"></div>
    <div id="alien-eye" class="pattern-area"></div>
    <div id="saturn" class="pattern-area"></div>
    <div id="submerged-sea-pearl" class="pattern-area"></div>
    <div id="deep-sea" class="pattern-area"></div>
    <div id="bloody-red" class="pattern-area"></div>
    <div id="aurora" class="pattern-area"></div>
    <div id="instagram" class="pattern-area"></div>
    <div id="pencils" class="pattern-area"></div>
    <div id="linear-lines" class="pattern-area"></div>
    <div id="face" class="pattern-area"></div>
    <div id="animated-text" class="pattern-area"></div>

    <h1></h1>
    </div>
  </main>
</body>

</html>
